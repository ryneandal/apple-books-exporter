name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build (aarch64)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build (x86_64)
        run: cargo build --release --target x86_64-apple-darwin

      - name: Universal binary
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/apple-books-data-export \
            target/x86_64-apple-darwin/release/apple-books-data-export \
            -output apple-books-data-export
          chmod +x apple-books-data-export

      - name: Archive
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          tar czvf "apple-books-data-export-${VERSION}.tar.gz" apple-books-data-export
          shasum -a 256 "apple-books-data-export-${VERSION}.tar.gz" > "apple-books-data-export-${VERSION}.tar.gz.sha256"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            apple-books-data-export-${{ github.ref_name }}.tar.gz
            apple-books-data-export-${{ github.ref_name }}.tar.gz.sha256

      # Fine-grained or classic PAT with contents:write on ryneandal/homebrew-books.
      # Repository → Settings → Secrets → HOMEBREW_TAP_TOKEN
      - name: Checkout Homebrew tap
        if: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: ryneandal/homebrew-books
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-books

      - name: Bump formula in tap
        if: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SHA256=$(awk '{print $1}' "apple-books-data-export-${VERSION}.tar.gz.sha256")
          FORMULA="homebrew-books/Formula/apple-books-data-export.rb"
          test -f "$FORMULA"
          URL="https://github.com/ryneandal/apple-books-exporter/releases/download/${VERSION}/apple-books-data-export-${VERSION}.tar.gz"
          sed -i '' \
            -e "s|^  url \".*\"|  url \"${URL}\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${SHA256}\"|" \
            "$FORMULA"
          cd homebrew-books
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/apple-books-data-export.rb
          if git diff --staged --quiet; then
            echo "Formula already up to date; nothing to commit."
            exit 0
          fi
          git commit -m "apple-books-data-export ${VERSION}"
          git push
