[package]
name = "apple-books-data-export"
description = "CLI tool for exporting Apple Books data"
repository = "https://github.com/ryne/apple-books-data-exporter"
license = "MIT"
authors = ["Ryne Andal <ryne.andal@gmail.com>"]
keywords = ["apple", "books", "data", "export"]
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
rusqlite = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.13"
